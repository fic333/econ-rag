[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "econ-rag"
version = "0.1.0"
description = "Retrieval-augmented study and test-generation system for intro economics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=4.0",
    "sentence-transformers>=2.2",
    "sqlalchemy>=2.0",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "numpy>=1.24",
    "click>=8.0",
]

[project.scripts]
econ-rag = "econ_rag.cli:cli"

[tool.setuptools]
packages = ["econ_rag", "econ_rag.services", "econ_rag.scripts", "web"]

[tool.setuptools.package-data]
web = ["static/*"]
